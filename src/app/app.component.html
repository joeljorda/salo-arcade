<div class="frame">
  <div class="screen">
    <div class="title-area">
      <h1>Benvinguts a Saló Arcade</h1>

      <div class="search-area">
        <app-barra-cerca (searchEvent)="onSearch($event)"></app-barra-cerca>
      </div>
    </div>
    
    <div class="content-area">
      <app-llista-elements [elements]="elements"></app-llista-elements>

      <p *ngIf="searchMessage" class="search-message">
        {{ searchMessage }}
      </p>
    </div>
  </div>
</div>
