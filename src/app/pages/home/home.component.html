<section class="home-page">
  <header class="home-header">
    <h2>Catàleg arcade</h2>
    <p>Llistat principal d'elements arcade.</p>
  </header>

  <cdk-virtual-scroll-viewport
    class="items-viewport"
    [itemSize]="itemSize"
    [minBufferPx]="itemSize * 4"
    [maxBufferPx]="itemSize * 8"
  >
    <app-element-card
      *cdkVirtualFor="let item of items; trackBy: trackByItemId"
      [item]="item"
    ></app-element-card>
  </cdk-virtual-scroll-viewport>
</section>
