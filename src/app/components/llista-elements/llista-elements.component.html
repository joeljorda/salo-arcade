<div *ngIf="elements.length > 0; else noElements" class="grid">
  <app-targeta-element
  *ngFor="let element of elements; trackBy: trackByElementId"
  [element]="element">
  </app-targeta-element>
</div>

<ng-template #noElements>
  <p class="no-elements-message">No s'han trobat cap joc.</p>
</ng-template>
